name: Validate skill

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 skills/korean-ux-writing/scripts/audit.py evals/fixtures/minimal/audit.json --require-complete
