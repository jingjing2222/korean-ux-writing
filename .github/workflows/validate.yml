name: Validate native plugin

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck

  native:
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
      - run: pnpm test
      - run: pnpm validate
      - name: Verify pinned evidence download with the native executable
        shell: bash
        run: |
          executable="skills/korean-ux-writing/scripts/bin/${{ matrix.target }}/kuw"
          if [ '${{ runner.os }}' = 'Windows' ]; then executable="${executable}.exe"; fi
          "$executable" evidence --out .reports/pinned-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: skills/korean-ux-writing/scripts/bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
